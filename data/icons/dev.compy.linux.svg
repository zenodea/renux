<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8FF"/>
      <stop offset="1" stop-color="#EFE9FA"/>
    </linearGradient>
    <linearGradient id="body" x1="0.85" y1="0.05" x2="0.15" y2="0.98">
      <stop offset="0" stop-color="#FFC83A"/>
      <stop offset="0.28" stop-color="#FF8A3C"/>
      <stop offset="0.52" stop-color="#F2569B"/>
      <stop offset="0.78" stop-color="#A56BFF"/>
      <stop offset="1" stop-color="#4FA3FF"/>
    </linearGradient>
    <linearGradient id="belly" x1="0.7" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F3ECFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wing" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#E24E97"/>
      <stop offset="1" stop-color="#6E5BE8"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#FF9A2E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- feet -->
  <ellipse cx="206" cy="424" rx="46" ry="20" fill="url(#beak)"/>
  <ellipse cx="306" cy="424" rx="46" ry="20" fill="url(#beak)"/>
  <!-- wings, behind the body -->
  <path d="M150 232c-44 30-62 88-50 142 4 16 24 16 32 2 16-30 34-62 52-88z" fill="url(#wing)"/>
  <path d="M362 232c44 30 62 88 50 142-4 16-24 16-32 2-16-30-34-62-52-88z" fill="url(#wing)"/>
  <!-- body: a rounded egg, head and all -->
  <path d="M256 82c-72 0-122 58-122 138 0 20 3 38 8 54-8 22-12 46-12 70 0 54 52 84 126 84s126-30 126-84c0-24-4-48-12-70 5-16 8-34 8-54 0-80-50-138-122-138z" fill="url(#body)"/>
  <!-- belly -->
  <path d="M256 236c-52 0-86 44-86 102 0 44 36 66 86 66s86-22 86-66c0-58-34-102-86-102z" fill="url(#belly)"/>
  <!-- eyes -->
  <ellipse cx="212" cy="190" rx="19" ry="25" fill="#2A1A5E"/>
  <ellipse cx="300" cy="190" rx="19" ry="25" fill="#2A1A5E"/>
  <circle cx="219" cy="180" r="7" fill="#FFFFFF"/>
  <circle cx="307" cy="180" r="7" fill="#FFFFFF"/>
  <!-- beak -->
  <path d="M256 208c-16 0-30 8-30 18 0 12 16 26 30 26s30-14 30-26c0-10-14-18-30-18z" fill="url(#beak)"/>
  <path d="M230 230c8 6 17 9 26 9s18-3 26-9" fill="none" stroke="#C4621A" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
</svg>
